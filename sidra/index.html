<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Escanciar sidra</title>
<style>body{margin:0;background:#2b1d14;color:#f3e6c8;font-family:Georgia,serif;text-align:center}canvas{display:block;margin:10px auto;border:4px solid #1a110b;background:#4a3020;cursor:none}</style></head><body>
<div>Mantén pulsado el ratón para escanciar. Mueve el ratón en horizontal para colocar el vaso y en vertical para subir o bajar el brazo. R: otro culín.</div>
<canvas id="c" width="900" height="560"></canvas>
<script>
// Escanciar sidra (prototipo). Más altura = más espuma (puntos) pero el viento desvía más el chorro.
const c=document.getElementById('c'),x=c.getContext('2d');let m={x:450,y:150,down:false},s;
function reset(){s={glass:450,bottle:450,wind:0,windT:0,inGlass:0,spilled:0,foam:0,drops:[],done:false,time:0}}reset();
c.onmousemove=e=>{const r=c.getBoundingClientRect();m.x=e.clientX-r.left;m.y=e.clientY-r.top};
c.onmousedown=()=>m.down=true;onmouseup=()=>{if(m.down&&s.inGlass+s.spilled>5)s.done=true;m.down=false};
onkeydown=e=>{if(e.key.toLowerCase()=='r')reset()};
const H=()=>Math.max(40,Math.min(260,300-m.y));
function step(dt){if(s.done)return;s.time+=dt;s.windT-=dt;
 if(s.windT<=0){s.wind=(Math.random()-.5)*140;s.windT=1+Math.random()*2}
 s.bottle=450+Math.sin(s.time*1.3)*70;s.glass+=(m.x-s.glass)*dt*6;const h=H();
 if(m.down){const f=60*dt;s.drops.push({x:s.bottle,y:60,vx:s.wind*h/260,vy:0,ml:f,h})}
 for(const d of s.drops){d.vy+=900*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;
  if(!d.dead&&d.y>=440){d.dead=true;if(Math.abs(d.x-s.glass)<28){s.inGlass+=d.ml;s.foam+=d.ml*d.h/260}else s.spilled+=d.ml}}
 s.drops=s.drops.filter(d=>!d.dead);if(s.inGlass>=180)s.done=true}
const score=()=>Math.round(Math.max(0,100-Math.abs(s.inGlass-120)+Math.min(50,s.foam*.6)-s.spilled*1.2));
// Fondo del chigre: pared de piedra, estantes con botellas, pipas, lámparas y barra de madera.
const bg=document.createElement('canvas');bg.width=900;bg.height=560;(function(){const g=bg.getContext('2d');
 let gr=g.createLinearGradient(0,0,0,560);gr.addColorStop(0,'#3b2a1e');gr.addColorStop(1,'#1c130c');g.fillStyle=gr;g.fillRect(0,0,900,560);
 for(let y=0;y<420;y+=28)for(let x=(y/28%2)*30-30;x<900;x+=60){g.fillStyle=`hsl(25,18%,${16+Math.random()*8}%)`;g.fillRect(x+2,y+2,56,24)}
 for(const sy of [150,250]){g.fillStyle='#5a3a22';g.fillRect(560,sy,320,10);
  for(let i=0;i<11;i++){const bx=575+i*28;g.fillStyle=i%3?'#1f4d2b':'#2c6a3a';g.fillRect(bx,sy-52,16,52);g.fillRect(bx+5,sy-66,6,14);
   g.fillStyle='rgba(255,255,255,.25)';g.fillRect(bx+3,sy-48,3,40);g.fillStyle='#e8dcc0';g.fillRect(bx+2,sy-34,12,14)}}
 for(const px of [60,190]){gr=g.createLinearGradient(px,0,px+110,0);gr.addColorStop(0,'#4a2c16');gr.addColorStop(.5,'#8a5a32');gr.addColorStop(1,'#3a210f');
  g.fillStyle=gr;g.beginPath();g.ellipse(px+55,360,55,70,0,0,7);g.fill();g.strokeStyle='#222';g.lineWidth=5;
  for(const dy of[-40,40]){g.beginPath();g.ellipse(px+55,360+dy,52,10,0,0,7);g.stroke()}}
 g.fillStyle='#f3e6c8';g.font='bold 30px Georgia';g.fillText('CHIGRE «EL MUELLE»',300,60);
 gr=g.createLinearGradient(0,500,0,560);gr.addColorStop(0,'#8b5e3a');gr.addColorStop(1,'#4a2e18');g.fillStyle=gr;g.fillRect(0,500,900,60);
 g.fillStyle='rgba(255,255,255,.12)';g.fillRect(0,500,900,4)})();
function draw(){x.drawImage(bg,0,0);
 // luz cálida de lámpara
 let L=x.createRadialGradient(450,0,10,450,0,500);L.addColorStop(0,'rgba(255,200,120,.35)');L.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=L;x.fillRect(0,0,900,560);
 // brazo y botella
 x.strokeStyle='#d9a882';x.lineWidth=18;x.lineCap='round';x.beginPath();x.moveTo(s.bottle+8,30);x.lineTo(s.bottle+70,-20);x.stroke();
 let G=x.createLinearGradient(s.bottle-13,0,s.bottle+13,0);G.addColorStop(0,'#0f2a17');G.addColorStop(.35,'#3f8a52');G.addColorStop(1,'#0f2a17');
 x.fillStyle=G;x.fillRect(s.bottle-13,10,26,52);x.fillRect(s.bottle-5,58,10,8);
 // chorro con volumen: trazo grueso dorado con brillo central
 if(s.drops.length>1){for(const [w,col] of [[7,'rgba(200,140,30,.85)'],[3,'rgba(255,235,150,.9)']]){x.strokeStyle=col;x.lineWidth=w;x.beginPath();
  let first=true;for(const d of s.drops){if(first){x.moveTo(d.x,d.y);first=false}else x.lineTo(d.x,d.y)}x.stroke()}}
 // vaso de sidra: cristal fino, ancho arriba
 const gx=s.glass,top=430,bot=500,l=Math.min(64,s.inGlass/2.8),fo=Math.min(14,s.foam/5);
 x.save();x.beginPath();x.moveTo(gx-34,top);x.lineTo(gx+34,top);x.lineTo(gx+28,bot);x.lineTo(gx-28,bot);x.closePath();
 x.fillStyle='rgba(220,240,255,.12)';x.fill();x.clip();
 G=x.createLinearGradient(0,bot-l,0,bot);G.addColorStop(0,'#f2c85a');G.addColorStop(1,'#c98a1e');x.fillStyle=G;x.fillRect(gx-40,bot-l,80,l);
 for(let i=0;i<6;i++){x.fillStyle='rgba(255,255,220,.6)';x.fillRect(gx-20+((s.time*40+i*17)%40),bot-((s.time*60+i*23)%Math.max(1,l)),2,2)}
 x.fillStyle='#fffbe8';x.fillRect(gx-40,bot-l-fo,80,fo);x.restore();
 x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2;x.beginPath();x.moveTo(gx-34,top);x.lineTo(gx-28,bot);x.lineTo(gx+28,bot);x.lineTo(gx+34,top);x.stroke();
 x.fillStyle='rgba(255,255,255,.35)';x.fillRect(gx-26,top+6,4,58);
 // HUD
 x.fillStyle='rgba(0,0,0,.45)';x.fillRect(10,10,330,96);x.fillStyle='#f3e6c8';x.font='16px Georgia';x.textAlign='left';
 x.fillText('Altura del brazo: '+Math.round(H()/2.6)+'%',20,30);
 x.fillText('Viento: '+(s.wind>0?'hacia la derecha ':'hacia la izquierda ')+Math.abs(Math.round(s.wind)),20,52);
 x.fillText('En el vaso: '+Math.round(s.inGlass)+' ml (ideal 120)',20,74);
 x.fillText('Derramado: '+Math.round(s.spilled)+' ml',20,96);
 if(s.done&&!s.drops.length){const p=score();x.fillStyle='rgba(0,0,0,.6)';x.fillRect(150,210,600,90);x.fillStyle='#f3e6c8';x.textAlign='center';x.font='32px Georgia';
  x.fillText((p>130?'¡Así se escancia, ho!':p>80?'Bien echado.':p>40?'Pasable.':'Eso ye pa tirar.')+'  Puntos: '+p,450,250);
  x.font='18px Georgia';x.fillText('Pulsa R para otro culín',450,285)}}
let t0=performance.now();(function loop(t){step(Math.min(.05,(t-t0)/1000));t0=t;draw();requestAnimationFrame(loop)})(t0);
</script></body></html>
